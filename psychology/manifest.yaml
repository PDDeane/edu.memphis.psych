# manifest.yaml — Memphis general psychology content collection.
#
# Used by: scripts/build-static.ts --manifest <this file>

title: Psychology Study Group
namespace: edu.memphis.psych

# THE PRE-NAMESPACING DATA LAYOUT (J-4d, 2026-09-24). This course's submissions
# and outputs live at the SHARED roots -- $COURSE_DATA/"Handout Submissions with
# Scoring and Feedback" and $COURSE_DATA/out -- rather than under
# $COURSE_DATA/courses/<namespace>/. It is declared here, and read only when this
# manifest's own `namespace` matches the course being run, so that a second
# course cannot inherit the layout by accident. A new course should NOT set this.
shared_data_layout: true
classes:
  - no-translanguaging
content_notice: >
  Course content Copyright &copy; 2026 by Mollie Blair Anderson, Randy Floyd,
  Emily N Srisarajivakul, and Kara Watkins, with contributions from Piotr Mitros
  and Paul Deane. Licensed under
  [AGPLv3](https://www.gnu.org/licenses/agpl-3.0.html). Source available on
  [GitHub](https://github.com/olxhub/edu.memphis.psych).
routes:
  /: edu.memphis.psych/psych_course
  /bmod: edu.memphis.psych/bmod_course
  /bmod/handout1: edu.memphis.psych/bmod_handout1
  /bmod/handout2: edu.memphis.psych/bmod_handout2
  /bmod/handout3: edu.memphis.psych/bmod_handout3
  /practice/highlighting: edu.memphis.psych/psych_highlight_quizzes
