# manifest.yaml — Memphis general psychology content collection.
#
# Used by: scripts/build-static.ts --manifest <this file>

title: Psychology Study Group
namespace: edu.memphis.psych

# THE DATA LAYOUT IS THE STANDARD ONE (2026-09-26). `shared_data_layout: true`
# stood here until the user authorised the move: this course's submissions,
# hand-split fixtures and run outputs sat at the SHARED roots --
# $COURSE_DATA/"Handout Submissions with Scoring and Feedback",
# $COURSE_DATA/handsplit and $COURSE_DATA/out -- where a second course would
# have collided with them. They are now under $COURSE_DATA/courses/<namespace>/
# like every other course's, so the declaration has nothing left to declare and
# the absent flag means what a new course's absent flag means.
#
# THE LEGACY DIRECTORIES STILL EXIST and are no longer read. Nothing detects
# them -- the layout is declared, never sniffed -- so they are inert rather than
# dangerous, and they are the recovery path until the move is trusted.

# THIS COLLECTION'S OWN FILENAMES. `paths.py` defaulted to them -- `COURSE_OLX =
# _manifest("course_olx", "bmod_course.olx")` -- so this course's filenames sat
# in the engine as fallbacks, the same embedding the directory names carried
# until subgoal E58 moved those out. Declared here, the engine needs no default
# and lo-blocks can read them without one either.
#
# `%d` IS THE FORM NUMBER, which is why the handout pattern is a template and
# not a list: a course with four handouts changes nothing here.
course_olx: bmod_course.olx
rubric_component: bmod_rubric.olx
handout_olx: bmod_handout%d.olx
classes:
  - no-translanguaging
content_notice: >
  Course content Copyright &copy; 2026 by Mollie Blair Anderson, Randy Floyd,
  Emily N Srisarajivakul, and Kara Watkins, with contributions from Piotr Mitros
  and Paul Deane. Licensed under
  [AGPLv3](https://www.gnu.org/licenses/agpl-3.0.html). Source available on
  [GitHub](https://github.com/olxhub/edu.memphis.psych).
routes:
  /: edu.memphis.psych/psych_course
  /bmod: edu.memphis.psych/bmod_course
  /bmod/handout1: edu.memphis.psych/bmod_handout1
  /bmod/handout2: edu.memphis.psych/bmod_handout2
  /bmod/handout3: edu.memphis.psych/bmod_handout3
  /practice/highlighting: edu.memphis.psych/psych_highlight_quizzes
